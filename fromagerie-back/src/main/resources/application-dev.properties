# Configuration de confort strictement réservée au développement local.
# Activation explicite : ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Flyway crée le schéma sur une base vide ; Hibernate vérifie ensuite sa conformité.

spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Fournir DEMO_OWNER_PASSWORD, DEMO_EMPLOYEE_PIN et DEMO_SALES_PIN
# dans l'environnement avant de lancer le profil dev. Aucun secret dans le dépôt.
