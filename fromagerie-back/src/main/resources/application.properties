spring.application.name=fromagerie-back

# Écoute sur le réseau local pour permettre un test depuis un autre ordinateur.
server.address=0.0.0.0
server.port=8080

# Le lancement local avec ./mvnw spring-boot:run active les comptes de démonstration.
# Un profil explicite, par exemple prod, remplace cette valeur par défaut.
spring.profiles.default=dev

# Connexion à la base
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fromagerie_db}
spring.datasource.username=${DB_USERNAME:fromagerie_user}
spring.datasource.password=${DB_PASSWORD:root1234$}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.schema-migration.enabled=true

# Suivi analytique: seuil technique IQR et saisons malgaches configurables (format MM-dd).
fromagerie.analytics.anomalies.minimum-samples=8
fromagerie.analytics.saisons.seche.debut=05-01
fromagerie.analytics.saisons.seche.fin=10-31
fromagerie.analytics.saisons.humide.debut=11-01
fromagerie.analytics.saisons.humide.fin=04-30

# Session HTTP d'authentification
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
