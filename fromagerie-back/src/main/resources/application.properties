spring.application.name=fromagerie-back

# Par défaut, l'application n'est accessible que depuis la machine locale.
# Une adresse d'écoute publique doit être choisie explicitement au déploiement.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# Connexion à la base
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fromagerie_db}
spring.datasource.username=${DB_USERNAME:fromagerie_user}
# Aucun secret par défaut : DB_PASSWORD doit être fourni par l'environnement.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false

# Suivi analytique: seuil technique IQR et saisons malgaches configurables (format MM-dd).
fromagerie.analytics.anomalies.minimum-samples=8
fromagerie.analytics.saisons.seche.debut=05-01
fromagerie.analytics.saisons.seche.fin=10-31
fromagerie.analytics.saisons.humide.debut=11-01
fromagerie.analytics.saisons.humide.fin=04-30

# Session HTTP d'authentification
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Aucun autre site autorisé à appeler l'API avec des cookies par défaut.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
