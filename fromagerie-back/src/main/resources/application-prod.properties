# Profil de production : fournir DB_URL, DB_USERNAME et DB_PASSWORD au déploiement.
# Flyway applique les migrations versionnées avant la validation JPA.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate ne modifie jamais la structure ; Flyway applique uniquement les scripts versionnés.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

# Les sessions de production doivent être transmises uniquement en HTTPS.
server.servlet.session.cookie.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
