spring.datasource.url=jdbc:h2:mem:fromagerie-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
fromagerie.analytics.anomalies.minimum-samples=4
fromagerie.analytics.saisons.seche.debut=05-01
fromagerie.analytics.saisons.seche.fin=10-31
fromagerie.analytics.saisons.humide.debut=11-01
fromagerie.analytics.saisons.humide.fin=04-30
server.servlet.session.timeout=10m
debug=false
logging.level.root=WARN
app.cors.allowed-origins=http://localhost:5173
